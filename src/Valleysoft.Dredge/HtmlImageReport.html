<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Dredge image report</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
:root {
  color-scheme: light;
  --ground: #FAFAF7; --channel: #0B7A76; --channel-deep: #CFEDEB; --graphite: #ECEFF3;
  --foam: #1F2328; --silt: #57606A; --shale: #9AA3AD; --keycap: #D6DCE3;
  --kelp: #2E7D32; --kelp-deep: #DDF2D8; --ochre: #946200; --ochre-deep: #B98A1E;
  --garnet: #C0283B; --garnet-deep: #FBE1E5; --bedrock1: #91AABB; --bedrock2: #BDCDD7;
  --sand1: #BC875B; --sand2: #D7B287; --waste: #D9818A; --shared2: #B4BBC4;
  --dir: #0550AE; --keyword: #8250DF; --mark: #F6E7A8;
  --df-literal: #0550AE; --df-string: #953800; --df-symbol: #9A6700;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #1B1F27; --channel: #3FB6B2; --channel-deep: #153A3B; --graphite: #262B33;
  --foam: #E3E7ED; --silt: #8B93A1; --shale: #4A5260; --keycap: #39404B;
  --kelp: #8CC46E; --kelp-deep: #1E3A22; --ochre: #EFBF3F; --ochre-deep: #C99E2E;
  --garnet: #E5566E; --garnet-deep: #4A1E27; --bedrock1: #324451; --bedrock2: #4C6371;
  --sand1: #684728; --sand2: #825A34; --waste: #963C4F; --shared2: #5A6270;
  --dir: #9FC4E8; --keyword: rgb(194, 133, 191); --mark: #5C4A12;
  --df-literal: #96DCFE; --df-string: #CA9178; --df-symbol: #FAC81F;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--ground); color: var(--foam);
  font: 13px/1.5 "Cascadia Mono", Consolas, "Courier New", monospace;
}
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--channel); outline-offset: 1px; }
.app { display: flex; flex-direction: column; height: 100vh; padding: 0 1ch; }
.silt { color: var(--silt); }
.foam { color: var(--foam); }
.bold { font-weight: 700; }
.kelp { color: var(--kelp); } .ochre { color: var(--ochre); } .garnet { color: var(--garnet); }
.channel { color: var(--channel); }

/* Header */
.title-row { display: flex; flex-wrap: wrap; gap: 0.3em 2ch; align-items: baseline; min-width: 0; }
.brand { color: var(--channel); font-weight: 700; }
.ref { flex: 1 1 25ch; min-width: 0; font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#meta { flex: 1 1 15ch; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.stats { margin-left: auto; white-space: pre; flex-shrink: 0; }
.modes { display: inline-flex; gap: 0; flex-shrink: 0; white-space: nowrap; }
.modes button { padding: 0 1ch; color: var(--silt); }
.modes button[aria-pressed="true"] { background: var(--keycap); color: var(--foam); font-weight: 700; }
.core { margin-top: 0; }
.bar { display: flex; height: 1.25em; width: 100%; }
.group { display: flex; flex-direction: column; min-width: 0; }
.group .strata { display: flex; height: 1.25em; }
.stratum { height: 100%; min-width: 0; position: relative; flex: 0 0 auto; }
.stratum:hover { filter: brightness(1.15); }
.bracket {
  margin: 0 1px 1.5em; height: 0.8em; border: 1px solid var(--shale); border-top: 0;
  border-radius: 0 0 3px 3px; position: relative;
}
.bracket span {
  position: absolute; z-index: 1; left: 50%; top: 1px; transform: translateX(-50%);
  background: var(--ground); padding: 0 1ch; color: var(--silt); white-space: nowrap;
  max-width: calc(100% - 2ch); overflow: hidden; text-overflow: ellipsis;
}
.bracket .layer-indicator { position: absolute; bottom: -1px; height: 2px; background: var(--channel); }
.cmp-bar { display: grid; grid-template-columns: minmax(8ch, 14ch) minmax(0, 1fr); align-items: center; margin-bottom: 3px; }
.cmp-bar .bar { height: 14px; }
.header-actions { display: flex; flex-shrink: 0; flex-wrap: wrap; gap: 0.4em 1ch; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4em 1ch; padding: 0.4em 1ch; }
.toolbar:empty { display: none; }
.toolbar button, .header-actions button, .insight-action {
  border: 1px solid var(--shale); border-radius: 3px; padding: 0.15em 0.8ch;
}
.toolbar button:hover, .header-actions button:hover, .insight-action:hover { background: var(--graphite); }
.toolbar button[aria-pressed="true"], .header-actions button[aria-pressed="true"] {
  background: var(--channel-deep); border-color: var(--channel); color: var(--foam); font-weight: 700;
}
.toolbar button:disabled { opacity: 0.5; cursor: default; }
.toolbar .filter input { width: min(28ch, 100%); }
.toolbar .filter { min-width: 0; }
.toolbar .search-count { color: var(--silt); }
.tree-toggle { color: var(--silt); display: inline-block; width: 2ch; text-align: left; }
.insight-action { display: inline-block; margin-top: 0.5em; }

/* Panes */
.body {
  flex: 1; min-height: 0; display: grid; gap: 1.5em 1ch; padding-top: 0.5em;
  grid-template-columns: minmax(0, 60ch) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) calc(13 * 1.2em);
}
.pane {
  position: relative; border: 1px solid var(--shale); border-radius: 3px;
  padding: 0.5em 0 0; min-height: 0; display: flex; flex-direction: column;
}
.pane:focus-within { border-color: var(--channel); box-shadow: inset 0 0 0 1px var(--channel); }
.pane:focus-visible { outline: none; }
.pane-title {
  position: absolute; top: -0.8em; left: 1ch; margin: 0; padding: 0 1ch;
  background: var(--ground); font-size: inherit; font-weight: 700; white-space: nowrap;
  max-width: calc(100% - 2ch); overflow: hidden; text-overflow: ellipsis;
}
.pane-title .sub { color: var(--silt); font-weight: 400; margin-left: 1ch; }
.pane-body { overflow: auto; min-height: 0; flex: 1; padding: 0 1ch; scrollbar-color: var(--shale) transparent; }
#layers-pane { grid-column: 1; grid-row: 1; }
#details-pane { grid-column: 1; grid-row: 2; }
#details { white-space: pre-wrap; overflow-wrap: anywhere; }
#right-pane { grid-column: 2; grid-row: 1 / span 2; }

/* Layers */
.lrow {
  display: grid; grid-template-columns: 1ch var(--index-width, 2ch) 9ch minmax(0, 1fr); align-items: center;
  white-space: nowrap; cursor: pointer;
}
.lrow.cmp { grid-template-columns: 1ch 3ch 8ch 2ch 8ch 8ch minmax(0, 1fr); gap: 0 1ch; }
.lrow .mark { color: var(--channel); }
.lrow .idx { color: var(--silt); text-align: right; padding-right: 1ch; }
.lrow .ins { overflow: hidden; text-overflow: ellipsis; }
.lrow.config { color: var(--silt); cursor: default; }
.lrow.config .kw { color: var(--silt); font-weight: 400; }
.lrow.config .flag, .lrow.config .syntax-string, .lrow.config .syntax-symbol { color: var(--silt); }
.lrow.dim { color: var(--silt); }
.lrow[aria-selected="true"] { background: var(--graphite); }
#layers:focus .lrow[aria-selected="true"], #layers:focus-within .lrow[aria-selected="true"] { background: var(--channel-deep); }
.lrow[aria-selected="true"] .idx { color: var(--foam); font-weight: 700; }
#layers:focus { outline: none; }
.gauge { text-align: right; margin-right: 1ch; }
.num { text-align: right; }
.divider { color: var(--silt); white-space: nowrap; overflow: hidden; }
.kw { color: var(--keyword); }
.flag { color: var(--df-literal); }
.syntax-string { color: var(--df-string); }
.syntax-symbol { color: var(--df-symbol); }

/* Right pane */
.controls { display: flex; flex-wrap: wrap; gap: 0 1ch; align-items: center; padding: 0 1ch; }
.toggle button { padding: 0 1ch; color: var(--silt); }
.toggle button:hover { background: var(--graphite); }
.toggle button[aria-pressed="true"] { background: var(--keycap); color: var(--foam); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 1ch; }
.chip { background: var(--graphite); padding: 0 1ch; }
button.chip { border: 1px solid var(--shale); border-radius: 2px; }
button.chip:hover { border-color: var(--channel); }
.chip[aria-pressed="false"] { text-decoration: line-through; color: var(--silt); }
.chip[aria-pressed="false"] b { color: var(--silt); }
.chip.zero b { color: var(--shale); }
.filter { display: flex; align-items: center; gap: 1ch; }
.filter input {
  width: 26ch; background: var(--graphite); border: 1px solid transparent; padding: 0 1ch; border-radius: 2px;
}
.filter input:focus { border-color: var(--channel); outline: none; }
.push { margin-left: auto; }
.colhead {
  display: grid; grid-template-columns: 1fr 10ch; color: var(--silt); padding: 0 1ch;
  margin: 0 1ch;
}
.colhead span:last-child, .trow .size { text-align: right; }
.trow {
  display: grid; grid-template-columns: 2ch 1fr 10ch; white-space: nowrap; cursor: pointer;
  align-items: center; border-radius: 2px;
}
.trow.metadata { grid-template-columns: 1ch 2ch 12ch 11ch 10ch minmax(0, 1fr); }
.colhead.metadata { grid-template-columns: 12ch 11ch 10ch minmax(0, 1fr); padding-left: 3ch; }
.colhead.metadata span:nth-child(2), .colhead.metadata span:nth-child(3) { text-align: right; }
.colhead.metadata span:last-child { text-align: left; padding-left: 2ch; }
.file-mode, .file-owner { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-owner { text-align: right; padding-right: 2ch; }
.selection-mark { color: var(--channel); }
.trow.metadata .name { display: flex; min-width: 0; padding-left: 2ch; }
.file-name-content { overflow: hidden; text-overflow: ellipsis; }
.tree-note { color: var(--garnet); margin-left: auto; padding-left: 1ch; overflow: hidden; text-overflow: ellipsis; }
.search-row { display: grid; width: 100%; grid-template-columns: 12ch 8ch minmax(0, 1fr) max-content; gap: 0 1ch; text-align: left; white-space: nowrap; }
.search-row .path { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.search-row .path.deleted, .search-row .search-size.deleted { color: var(--garnet); text-decoration: line-through; }
.search-history { white-space: nowrap; overflow: hidden; }
.search-selection { border-top: 1px solid var(--shale); margin: 4px 1ch 0; padding: 4px 0; }
.search-colhead { display: grid; grid-template-columns: 12ch 8ch minmax(0, 1fr) max-content; gap: 0 1ch; color: var(--silt); }
.search-row .note { grid-column: 4; text-align: right; color: var(--garnet); }
@container (max-width: 70ch) {
  .trow.metadata { grid-template-columns: 1ch 2ch 10ch minmax(0, 1fr); }
  .colhead.metadata { grid-template-columns: 10ch minmax(0, 1fr); padding-left: 3ch; }
  .metadata .file-mode, .metadata .file-owner { display: none; }
}
#right-pane { container-type: inline-size; }
.trow.comparison { grid-template-columns: 2ch 12ch 2ch 12ch 10ch minmax(0, 1fr); gap: 0 1ch; }
.colhead.comparison { grid-template-columns: 12ch 2ch 12ch 10ch minmax(0, 1fr); gap: 0 1ch; padding-left: 3ch; }
.colhead.comparison span { text-align: right; }
.colhead.comparison span:last-child { text-align: left; }
.trow:hover { background: var(--graphite); }
.trow[aria-selected="true"] { background: var(--channel-deep); }
.right-selected { background: var(--channel-deep); }
#right-pane:not(:focus-within) .right-selected,
#right-pane:not(:focus-within) .trow[aria-selected="true"] { background: var(--graphite); }
.trow .name { overflow: hidden; text-overflow: ellipsis; }
.tree-meta { color: var(--silt); padding-left: 1ch; }
.tree-guide { color: var(--silt); white-space: pre; }
.tw { color: var(--silt); display: inline-block; width: 2ch; }
.dirname { color: var(--dir); }
.trow.Added .name { color: var(--kelp); }
.trow.Modified .name { color: var(--ochre); }
.trow.Identical .name { color: var(--silt); }
.trow.Deleted .name, .trow.Removed .name { text-decoration: line-through; color: var(--garnet); }
.trow.Deleted .size, .trow.Removed .size { text-decoration: line-through; color: var(--garnet); }
.file-size { text-align: right; overflow: hidden; white-space: nowrap; }
.finding-marker { color: var(--garnet); }
mark { background: var(--mark); color: inherit; }
.more { color: var(--channel); padding: 0 1ch; text-decoration: underline; }
.empty { color: var(--silt); padding: 1em 0; }
.info {
  border-top: 1px solid var(--shale); margin: 0 1ch; padding: 0.5em 0;
  display: flex; gap: 2ch; white-space: nowrap; overflow: hidden; min-height: 1.2em;
}
.info .path { overflow: hidden; text-overflow: ellipsis; }
.info-right { margin-left: auto; display: flex; gap: 2ch; }
.badge { background: var(--graphite); padding: 0 0.5ch; margin-right: 0.5ch; }
.list { margin: 0; padding-left: 2ch; }
.list li { margin: 0 0 4px; }
.package-note { margin: 0 1ch 6px; white-space: normal; }
.insight-group { border-bottom: 1px solid var(--shale); }
.insight-breakdown { display: flex; height: 8px; margin: 8px 0 2px; }
.insight-breakdown span { min-width: 1px; }
.insight-legend { display: flex; flex-wrap: wrap; gap: 2px 2ch; color: var(--silt); margin-bottom: 8px; }
.insight-group > summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
.insight-group.finding-selected > summary { background: var(--channel-deep); }
.insight-detail { padding: 2px 2ch 10px; white-space: normal; }
.insight-roots, .insight-layers { display: flex; flex-wrap: wrap; gap: 0 1ch; margin-top: 4px; }
.package-group { border-bottom: 1px solid var(--shale); }
.package-group > summary { cursor: pointer; font-weight: 700; padding: 3px 0; }
.package-row { margin-left: 2ch; }
.package-row > summary {
  display: grid; grid-template-columns: 2ch minmax(0, 1fr) minmax(10ch, 35%); gap: 0 1ch;
  cursor: pointer; list-style: none; white-space: nowrap;
}
.package-row > summary::-webkit-details-marker { display: none; }
.package-row > summary::before { content: "\25b8"; color: var(--silt); }
.package-row[open] > summary::before { content: "\25be"; }
.package-row > summary:hover, .package-row[open] > summary { background: var(--graphite); }
.package-row .name, .package-row .version { overflow: hidden; text-overflow: ellipsis; }
.package-detail { padding: 4px 3ch 8px; overflow-wrap: anywhere; white-space: normal; }
.package-group .empty { margin: 0 0 0 2ch; padding: 2px 0 6px; }
.comparison-section > summary { padding: 4px 0; cursor: pointer; font-weight: 700; }
.comparison-section > summary .silt { font-weight: 400; margin-left: 2ch; }
.comparison-section-body { padding-left: 2ch; }
.comparison-section + .comparison-section { border-top: 1px solid var(--shale); margin-top: 6px; }
.package-scope { margin-left: 2ch; }
.package-scope > summary { cursor: pointer; font-weight: 700; }
.package-scope > summary .silt { font-weight: 400; margin-left: 2ch; }
.comparison-unchanged { margin-left: 2ch; }
.comparison-summary { gap: 1ch; padding: 0 0 6px; }
.comparison-summary span { white-space: nowrap; }
.comparison-search { grid-template-columns: 2ch minmax(0, 1fr) max-content; }
.comparison-search.has-sizes { grid-template-columns: 2ch 12ch 2ch 12ch 10ch minmax(0, 1fr); }
.comparison-search .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.comparison-search .package-version { color: var(--silt); text-align: right; }
.package-diff-row { display: grid; grid-template-columns: 2ch minmax(0, 1fr) minmax(10ch, 40%); gap: 0 1ch; }
.package-diff-row .version { color: var(--silt); overflow: hidden; text-overflow: ellipsis; }
.package-diff-row .name { overflow: hidden; text-overflow: ellipsis; }
.search-editor { display: flex; align-items: center; gap: 1ch; }
.overview-gap { height: 1.2em; }
.overview-choice { display: block; width: 100%; text-align: left; }
.overview-choice .choice-mark { display: inline-block; width: 2ch; color: var(--channel); }
.overview-choice .silt { font-weight: 400; }
.snapshot-block { white-space: pre-wrap; overflow-wrap: anywhere; padding-bottom: 1em; }

.app { padding-bottom: 0.5em; }

@media (max-width: 760px) {
  .body { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(8em, 22vh) minmax(0, 1fr); }
  #layers-pane { grid-column: 1; grid-row: 1; }
  #details-pane { display: none; }
  #right-pane { grid-column: 1; grid-row: 2; }
  body[data-view="search"] #layers-pane, body[data-view="insights"] #layers-pane,
  body[data-view="help"] #layers-pane, body[data-view="warnings"] #layers-pane,
  body[data-view="snapshot"] #layers-pane { display: none; }
  body[data-view="search"] #right-pane, body[data-view="insights"] #right-pane,
  body[data-view="help"] #right-pane, body[data-view="warnings"] #right-pane,
  body[data-view="snapshot"] #right-pane { grid-row: 1 / span 2; }
  .stats { margin-left: 0; white-space: normal; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-row">
      <span class="brand">dredge</span>
      <span class="ref" id="ref"></span>
      <span class="silt" id="meta"></span>
      <span class="modes" id="modes" role="group" aria-label="View"></span>
      <span class="stats" id="stats"></span>
      <div class="header-actions" id="header-actions"></div>
    </div>
    <div class="core" id="core" aria-label="Layers by size"></div>
  </header>
  <main class="body">
    <section class="pane" id="layers-pane" aria-labelledby="layers-title">
      <h2 class="pane-title" id="layers-title"></h2>
      <div class="pane-body" id="layers" role="listbox" tabindex="0" aria-labelledby="layers-title"></div>
    </section>
    <section class="pane" id="details-pane" aria-labelledby="details-title">
      <h2 class="pane-title" id="details-title"></h2>
      <div class="pane-body" id="details" aria-live="polite"></div>
    </section>
    <section class="pane" id="right-pane" tabindex="0" aria-labelledby="right-title">
      <h2 class="pane-title" id="right-title"></h2>
      <nav class="toolbar" id="view-controls" aria-label="Report views"></nav>
      <div class="toolbar" id="search-controls"></div>
      <div id="right" class="pane-body" style="padding: 0; display: flex; flex-direction: column;"></div>
    </section>
  </main>
</div>
<script type="application/octet-stream" id="report-data">/* DREDGE_REPORT_DATA */</script>
<script>
"use strict";
(async () => {
// The report data is gzip-compressed JSON, encoded as base64, to keep the file small.
const report = await (async () => {
  const encoded = atob(document.getElementById("report-data").textContent.trim());
  const bytes = Uint8Array.from(encoded, character => character.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
})();
const $ = id => document.getElementById(id);
const BATCH = 100;
const GLYPH = { Added: "+", Modified: "~", Identical: "=", Deleted: "\u2212" };
const TONE = { Added: "kelp", Modified: "ochre", Identical: "silt", Deleted: "garnet" };
const LAYER_KINDS = ["Added", "Modified", "Identical", "Deleted"];
const comparing = Array.isArray(report.differences) && report.images.length > 1;
const state = {
  mode: comparing ? "compare" : "image",
  side: 0,
  swapped: false,
  layer: null,
  row: 0,
  whole: false,
  view: comparing ? "overview" : "files",
  returnView: "files",
  filter: "",
  packageFilter: "",
  hidden: new Set(),
  packageCollapsed: new Set(),
  comparisonCollapsed: new Set(),
  expanded: new Set(),
  limits: new Map(),
  comparisonSearchLimit: BATCH,
  selected: null,
  rightIndex: 0,
  searchQuery: "",
  searchLayerOnly: false,
  searchIncludeDeleted: true,
  searchExactCase: false,
  searchReturnView: "files",
  findingsOnly: false,
  investigation: null,
  findingSelected: 0,
  showBaseFindings: false
};

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}
function add(parent, ...children) {
  for (const child of children) {
    if (child === null || child === undefined || child === false) continue;
    parent.append(typeof child === "string" ? document.createTextNode(child) : child);
  }
  return parent;
}
function clear(node) { node.replaceChildren(); return node; }
function size(bytes) {
  if (bytes < 1000) return bytes + " B";
  const kb = bytes / 1000;
  if (kb < 1000) return (kb < 10 ? kb.toFixed(1) : kb.toFixed(0)) + " KB";
  const mb = kb / 1000;
  if (mb < 1000) return mb.toFixed(1) + " MB";
  return (mb / 1000).toFixed(2) + " GB";
}
function sizeShort(bytes) { return bytes >= 10e6 ? Math.round(bytes / 1e6) + " MB" : size(bytes); }
function signed(delta) { return delta === 0 ? "\u00b10" : (delta > 0 ? "+" : "\u2212") + size(Math.abs(delta)); }
function count(n, one, many) { return n.toLocaleString("en-US") + " " + (n === 1 ? one : many || one + "s"); }
function shortDigest(digest) { return digest.length > 24 ? digest.slice(0, 19) + "\u2026" + digest.slice(-4) : digest; }
function sum(items, pick) { return items.reduce((total, item) => total + pick(item), 0); }
function allocateLayerWidths(sizes, width) {
  const nonzero = sizes.filter(size => size > 0).length;
  const total = sum(sizes, size => size);
  if (!total || width <= 0) return sizes.map(() => 0);
  if (nonzero > width) {
    const result = sizes.map(() => 0);
    sizes.map((size, index) => ({ size, index })).filter(item => item.size > 0)
      .sort((a, b) => b.size - a.size).slice(0, width).forEach(item => result[item.index] = 1);

function openImagePath(img, path, layer, whole, findingsOnly = false) {
  if (!layerAt(img, layer)) return;
  state.layer = layer;
  state.whole = whole;
  state.findingsOnly = findingsOnly;
  state.filter = "";
  state.view = "files";
  resetTree();
  const metadata = treeMetadata(img, layer, whole);
  let node = whole ? wholeSnapshot(img, layer).root : buildTree(layerAt(img, layer).changes, img, metadata);
  const parts = path.split("/");
  for (let i = 0; i < parts.length; i++) {
    const key = pathKey(img, parts.slice(0, i + 1).join("/"));
    const child = node.children.get(key);
    if (!child) break;
    const position = sortedChildren(node).indexOf(child);
    state.limits.set(node.path, Math.max(BATCH, position + 1));
    if (i < parts.length - 1) state.expanded.add(child.path);
    node = child;
  }
  state.selected = node.path;
  render();
  const rows = rightRows();
  state.rightIndex = Math.max(0, rows.findIndex(row => row.dataset.path === state.selected));
  markRightSelection();
  $("right-pane").focus({ preventScroll: true });
  rows[state.rightIndex]?.scrollIntoView({ block: "nearest" });
}
function openFindingPath(img, finding, path) {
  const normalize = value => img.platform.toLowerCase().startsWith("windows") ? foldCase(value) : value;
  const selectedPath = normalize(path);
  const layer = [...finding.layers].reverse().find(index => {
    const snapshot = layerAt(img, index);
    return snapshot?.changes.some(change => {
      const changedPath = normalize(change.path);
      return changedPath === selectedPath || changedPath.startsWith(selectedPath + "/");
    });
  }) ?? finding.layers.at(-1) ?? state.layer;
  if (!layerAt(img, layer)) return;
  state.investigation = captureInvestigation();
  state.layer = layer;
  state.hidden.clear();
  openImagePath(img, path, layer, state.whole, true);
}

function packageUnavailableReason() {

    target.unavailableReason ? pair()[1].label + ": " + target.unavailableReason : null].filter(Boolean).join(" ");
}
function renderComparisonSummary() {
  const packages = packageDifferences();
  const updated = packages.filter(item => item.before != null && item.after != null).length;
  const added = packages.filter(item => item.before == null).length;
  const removed = packages.filter(item => item.after == null).length;
  const status = el("div", "controls comparison-summary");
  const unavailable = packageUnavailableReason();
  if (unavailable) {
    status.append(el("span", "ochre", "Package inventory unavailable: " + unavailable));

  const [base, target] = pair().map(finalInventory);
  const missing = base.ecosystems.filter(left => {
    const right = target.ecosystems.find(item => item.ecosystem === left.ecosystem);
    return left.available !== right.available;
  }).map(item => item.ecosystem);

    add(el("span", "chip"), el("b", "ochre", "~"), " " + updated + " updated"),
    add(el("span", "chip"), el("b", "kelp", "+"), " " + added + " added"),

    el("span", "push " + (missing.length ? "ochre" : "silt"), missing.length
      ? "\u25b2 " + missing.join(", ") + " metadata unavailable"

  return status;
}

function foldCase(text) {
  return Array.from(text, char => {
    const upper = char.toUpperCase();
    return upper.length === char.length && !(char.codePointAt(0) > 127 && upper.codePointAt(0) < 128) ? upper : char;
  }).join("");
}

const searchIndexes = new WeakMap();
const searchResultsCache = new WeakMap();
function searchIndex(img) {
  let index = searchIndexes.get(img);
  if (index) return index;
  index = new Map();
  for (const layer of img.layers) for (const change of layer.changes) {
    const key = pathKey(img, change.path);
    if (!index.has(key)) index.set(key, []);
    const occurrences = index.get(key);
    const previous = occurrences[occurrences.length - 1];
    if (previous?.layer === layer.index) occurrences.pop();
    occurrences.push({ ...change, layer: layer.index });
  }
  searchIndexes.set(img, index);
  return index;
}
function searchResults(img) {
  const index = searchIndex(img);
  if (!state.searchQuery) return { hits: [], total: 0 };
  const cached = searchResultsCache.get(img);
  if (cached && cached.query === state.searchQuery && cached.layer === state.layer &&
      cached.layerOnly === state.searchLayerOnly && cached.includeDeleted === state.searchIncludeDeleted &&
      cached.exactCase === state.searchExactCase) return cached.result;
  const query = state.searchExactCase ? state.searchQuery : foldCase(state.searchQuery);
  const contains = path => (state.searchExactCase ? path : foldCase(path)).includes(query);
  const live = new Map((img.files || []).map(entry => [pathKey(img, entry.path), entry]));
  const hits = [];
  for (const occurrences of index.values()) {
    const last = occurrences[occurrences.length - 1];
    if (!state.searchIncludeDeleted && last.change === "Deleted") continue;
    let match;
    if (state.searchLayerOnly) match = [...occurrences].reverse().find(item => item.layer === state.layer && contains(item.path));
    else if (state.searchExactCase && img.platform.toLowerCase().startsWith("windows")) match = [...occurrences].reverse().find(item => contains(item.path));
    else if (contains(last.path)) match = last;
    if (match) {
      const key = pathKey(img, match.path);
      const entry = live.get(key);
      const finding = findingForPath(img, match.path);
      hits.push({
        path: match.path, occurrences, directory: entry?.type === "Directory",
        size: entry && entry.type !== "Directory" ? entry.size : 0,
        note: finding ? noteForFinding(finding, finding.layers[0]) : null
      });
    }
  }
  hits.sort((a, b) => a.path < b.path ? -1 : a.path > b.path ? 1 : 0);
  const result = { hits: hits.slice(0, 1000), total: hits.length };
  searchResultsCache.set(img, { query: state.searchQuery, layer: state.layer, layerOnly: state.searchLayerOnly,
    includeDeleted: state.searchIncludeDeleted, exactCase: state.searchExactCase, result });
  return result;
}

function openSearchHit(hit) {

  state.investigation = captureInvestigation();
  state.hidden.clear();
  const img = image();

function captureInvestigation() {

    limits: [...state.limits], selected: state.selected, rightIndex: state.rightIndex,
    filter: state.filter, packageFilter: state.packageFilter, findingSelected: state.findingSelected,
    showBaseFindings: state.showBaseFindings, searchQuery: state.searchQuery,

  const keyForPath = comparisonPathKey;
  const pathSizesByKey = pathSizes;
  const compareMetadata = new Map([...pathSizesByKey].map(([path, item]) => [path, {
    type: item.directory ? "Directory" : item.link ? "SymbolicLink" : "File",

    linkTarget: state.swapped ? item.swappedLinkTarget : item.linkTarget,
    change: state.swapped ? FLIP[item.change] || item.change : item.change
  }]));
  const sizeCells = node => {
    const totals = pathSizesByKey.get(keyForPath(node.path));
    const d = node.entry?.diff;
    const before = totals ? (state.swapped ? totals.after : totals.before) : d?.before;
    const after = totals ? (state.swapped ? totals.before : totals.after) : d?.after;
    return comparisonSizeCells(before, after);

  const heading = $("right").querySelector('[data-section="' + section + '"] > summary');
  const rows = rightRows();
  state.rightIndex = Math.min(rows.length - 1, Math.max(0, rows.indexOf(heading) + 1));
  markRightSelection();
  $("right-pane").focus({ preventScroll: true });
  rows[state.rightIndex]?.scrollIntoView({ block: "nearest" });
}

function packageRow(ecosystem, item, comparison) {
  if (comparison) return packageDifferenceRow(item);
  const row = el("details", "package-row");
  const summary = el("summary");
  const name = el("span", "name", item.name);
  name.title = item.name;
  const versions = item.versions.join(", ");
  const version = el("span", "version silt", versions);
  version.title = versions;
  add(summary, name, version);
  const detail = el("div", "package-detail");
  add(detail, el("span", "bold", ecosystem + "  " + item.name), el("br"),
    "Versions: " + versions);
  row.append(summary, detail);
  return row;
}
function packageDifferenceRow(item, level = 1, guide = "", query = "") {
  const row = el("div", "package-diff-row");
  row.setAttribute("role", "treeitem");
  row.setAttribute("aria-level", String(level));
  const name = add(el("span", "name"), el("span", "tree-guide", guide), highlight(item.name, query));
  add(row, el("span", TONE[item.change], GLYPH[item.change]), name,
    el("span", "version", item.change === "Modified" ? item.before + " \u2192 " + item.after : item.after ?? item.before));
  row.addEventListener("click", () => {
    state.selected = null;
    state.rightIndex = rightRows().indexOf(row);
    markRightSelection();
    $("right-pane").focus({ preventScroll: true });
  });
  return row;
}

function renderPackages(box, scroller, embedded = false) {
  if (embedded) scroller.setAttribute("role", "group");
  else scroller.removeAttribute("role");
  const comparison = state.mode === "compare";
  const query = (embedded ? state.filter : state.packageFilter).toLowerCase();
  const hidden = new Set();
  const controls = el("div", "controls");

  let groups;
  let total;
  let unavailable = [];
  let reason;
  let comparableInventory = false;
  if (comparison) {
    const [base, target] = pair().map(finalInventory);
    const diffs = packageDifferences();
    total = diffs.length;
    reason = packageUnavailableReason();
    groups = base.ecosystems.map(left => {
      const right = target.ecosystems.find(item => item.ecosystem === left.ecosystem);
      if (left.available !== right.available) {
        unavailable.push(left.ecosystem + " (" + (left.available ? pair()[1].label : pair()[0].label) + ")");
      }
      if (!left.available || !right.available) return null;
      comparableInventory = true;
      const items = diffs.filter(item => item.ecosystem === left.ecosystem);
      const unchanged = Math.max(0, right.packages.length - items.filter(item => item.after != null).length);
      return items.length || unchanged ? { ecosystem: left.ecosystem, items, unchanged } : null;
    }).filter(Boolean);
    if (!embedded) {
      setTitle("right-title", "Package differences", "final filesystems");
      controls.append(el("span", "push silt", count(total, "changed package")));
      box.append(controls);
      box.append(renderComparisonSummary());
    }
  } else {
    const current = inventory(image(), state.layer);
    groups = current.ecosystems.filter(group => group.available && group.packages.length)
      .map(group => ({ ecosystem: group.ecosystem, items: group.packages }));
    total = sum(groups, group => group.items.length);
    reason = current.unavailableReason;
    setTitle("right-title", "Packages", state.layer === null ? "empty image" : "through layer " + state.layer);
    controls.append(el("span", "push silt", count(total, "package")));
    box.append(controls);
  }

  if (reason) {
    scroller.append(el("p", "empty", reason));
    box.append(scroller);
    return;
  }
  if (unavailable.length) {
    scroller.append(el("p", "package-note ochre", "Package metadata unavailable: " + unavailable.join(", ") + ". These ecosystems were not compared."));
  }
  let rendered = 0;
  for (const group of groups) {
    const items = group.items.filter(item => {
      const versions = comparison ? (item.before ?? "") + " " + (item.after ?? "") : item.versions.join(" ");
      return !query || (embedded ? item.name : group.ecosystem + " " + item.name + " " + versions).toLowerCase().includes(query);
    });
    if (!items.length && query) continue;
    const section = el("details", "package-group");
    const key = (comparison ? "compare:" : "image:") + group.ecosystem;
    section.open = Boolean(query) || !state.packageCollapsed.has(key);
    const label = comparison
      ? group.items.length.toLocaleString("en-US") + " changed, " + group.unchanged.toLocaleString("en-US") + " unchanged"
      : count(group.items.length, "package");
    const heading = el("summary", null, group.ecosystem + "  " + label);
    if (embedded) {
      heading.setAttribute("role", "treeitem");
      heading.setAttribute("aria-level", "2");
      heading.setAttribute("aria-expanded", String(section.open));
      section.addEventListener("toggle", () => {
        if (!section.isConnected) return;
        heading.setAttribute("aria-expanded", String(section.open));
        markRightSelection();
      });
    }
    heading.addEventListener("click", () => {
      if (query) return;
      if (section.open) state.packageCollapsed.add(key); else state.packageCollapsed.delete(key);
    });
    section.append(heading);
    const limitKey = "\u0000package:" + key;
    const limit = state.limits.get(limitKey) || BATCH;
    const showUnchanged = embedded && group.unchanged > 0 && !query;
    if (embedded) renderComparisonPackageItems(section, group.ecosystem, items.slice(0, limit), query, showUnchanged);
    else for (const item of items.slice(0, limit)) section.append(packageRow(group.ecosystem, item, comparison));
    if (items.length > limit) {
      const more = el("button", "more", "Show " + Math.min(BATCH, items.length - limit) + " more");
      more.addEventListener("click", () => { state.limits.set(limitKey, limit + BATCH); renderRight(); });
      section.append(more);
    }
    if (!items.length && !showUnchanged) section.append(el("p", "empty", "No package version changes in this ecosystem."));
    if (showUnchanged) {
      const unchanged = add(el("div", "comparison-unchanged silt"), el("span", "tree-guide", "\u2514\u2500 "),
        count(group.unchanged, "unchanged package", "unchanged packages"));
      unchanged.setAttribute("role", "treeitem");
      unchanged.setAttribute("aria-level", "3");
      section.append(unchanged);
    }
    scroller.append(section);
    rendered += items.length;
  }
  if (!groups.length) {
    scroller.append(el("p", "empty", comparison
      ? comparableInventory ? "No packages detected in comparable ecosystems."
        : "No package ecosystem has readable metadata in both images."
      : "No packages detected at this layer."));
  } else if (!rendered && query) {
    scroller.append(el("p", "empty", "No packages match the current filters."));
  }
  box.append(scroller);
}

function renderComparisonPackageItems(container, ecosystem, items, query, unchanged) {
  const groups = new Map();
  for (const item of items) {
    const scope = ecosystem === "npm" && item.name.startsWith("@") && item.name.includes("/")
      ? item.name.slice(0, item.name.indexOf("/")) : item.name;
    if (!groups.has(scope)) groups.set(scope, []);
    groups.get(scope).push(item);
  }
  for (const [index, [name, packages]] of [...groups].entries()) {
    const last = index === groups.size - 1 && !unchanged;
    const branch = last ? "\u2514\u2500 " : "\u251c\u2500 ";
    let parent = container;
    let level = 3;
    if (packages.length > 1 || packages[0].name !== name) {
      const scope = el("details", "package-scope");
      const key = "scope:" + ecosystem + ":" + name;
      scope.open = Boolean(query) || state.expanded.has(key);
      const change = packages.every(item => item.change === "Added") ? "Added"
        : packages.every(item => item.change === "Deleted") ? "Deleted" : "Modified";
      const heading = add(el("summary"), el("span", "tree-guide", branch), el("span", TONE[change], GLYPH[change] + " " + name + "/"),
        el("span", "silt", count(packages.length, "changed package")));
      heading.setAttribute("role", "treeitem");
      heading.setAttribute("aria-level", "3");
      heading.setAttribute("aria-expanded", String(scope.open));
      scope.addEventListener("toggle", () => {
        if (!scope.isConnected) return;
        heading.setAttribute("aria-expanded", String(scope.open));
        markRightSelection();
      });
      heading.addEventListener("click", () => {
        if (!query) {
          if (scope.open) state.expanded.delete(key); else state.expanded.add(key);
        }
      });
      scope.append(heading);
      container.append(scope);
      parent = scope;
      level = 4;
    }
    for (const [packageIndex, item] of packages.entries()) {
      const guide = parent === container ? branch
        : (last ? "   " : "\u2502  ") + (packageIndex === packages.length - 1 ? "\u2514\u2500 " : "\u251c\u2500 ");
      parent.append(packageDifferenceRow(item, level, guide));
    }
  }
}

/* ---------- Controls ---------- */
function searchMatchCount() {
  if (state.view === "search") return searchResults(image()).total;
  if (state.mode === "compare") {
    const query = state.filter.toLowerCase();
    return packageDifferences().filter(item => item.name.toLowerCase().includes(query)).length +
      differences().filter(item => item.path.toLowerCase().includes(query)).length;
  }
  const query = state.packageFilter.toLowerCase();
  return sum(inventory(image(), state.layer).ecosystems.filter(group => group.available),
    group => group.packages.filter(item =>
      (group.ecosystem + " " + item.name + " " + item.versions.join(" ")).toLowerCase().includes(query)).length);
}
function renderControls() {
  const active = document.activeElement;
  const focusKey = active?.dataset.controlKey;
  const inputFocused = active?.id === "filter";
  const selectionStart = inputFocused ? active.selectionStart : null;
  const selectionEnd = inputFocused ? active.selectionEnd : null;
  const header = clear($("header-actions"));
  const views = clear($("view-controls"));
  const search = clear($("search-controls"));
  const button = (parent, label, action, pressed) => {
    const item = el("button", null, label);
    if (pressed !== undefined) item.setAttribute("aria-pressed", String(pressed));
    item.dataset.controlKey = parent.id + ":" + label;
    item.addEventListener("click", action);
    parent.append(item);
    return item;
  };
  if (warningsCount()) button(header, warningsLabel() + " (" + warningsCount() + ")", () => openUtility("warnings"), state.view === "warnings");
  if (state.mode === "compare") {
    button(header, "Swap sides", swapSides);
    button(header, "Snapshot", () => openUtility("snapshot"), state.view === "snapshot");
  }
  button(header, "Help", () => openUtility("help"), state.view === "help");
  const utility = ["help", "warnings", "snapshot"].includes(state.view);
  const viewItems = state.mode === "compare"
    ? [["overview", "Overview"], ["files", "Differences"]]
    : [["files", "Files"], ["packages", "Packages"], ["insights", "Insights"]];
  if (utility) {
    const returnLabel = viewItems.find(([view]) => view === state.returnView)?.[1].toLowerCase() || state.returnView;
    button(views, "Back to " + returnLabel, back);
  } else {
    for (const [view, label] of viewItems) {
      button(views, label, () => navigateView(view),
        state.view === view || (view === "files" && state.view === "search"));
    }
    if (state.investigation) {
      button(search, "Back to " + (state.investigation.view === "search" ? "search" : "insights"), restoreInvestigation);
    }
    if (state.view === "files" || state.view === "search" || state.view === "packages") {
      const packages = state.view === "packages";
      const field = state.mode === "compare" ? "filter" : packages ? "packageFilter" : "searchQuery";
      search.append(filterInput(packages));
      if (state[field] && state.view !== "search")
        search.append(el("span", "search-count", count(searchMatchCount(), "match", "matches")));
    }
  }
  if (inputFocused && $("filter")) {
    $("filter").focus({ preventScroll: true });
    $("filter").setSelectionRange(selectionStart, selectionEnd);
  } else if (focusKey) {
    const replacement = [...document.querySelectorAll("[data-control-key]")]
      .find(node => node.dataset.controlKey === focusKey && !node.disabled);
    (replacement || $("right-pane")).focus({ preventScroll: true });
  }
}

/* ---------- Actions ---------- */
function resetTree() { state.expanded.clear(); state.limits.clear(); state.selected = null; state.rightIndex = 0; }
function renderBody() { renderLayers(); renderDetails(); renderRight(); }
function render() { renderHeader(); renderBody(); renderControls(); }
window.addEventListener("resize", renderHeader);
function setMode(mode, side) {
  const view = packageContext() ? "packages" : "files";
  state.mode = mode;
  state.side = side;
  state.findingSelected = 0;
  state.findingsOnly = false;
  state.investigation = null;
  state.filter = "";
  state.searchQuery = "";
  state.packageFilter = "";
  state.view = mode === "compare" ? "overview" : view;
  state.returnView = view;
  resetTree();
  const img = image();
  if (mode === "image" && !layerAt(img, state.layer)) state.layer = img.layers.length ? img.layers[0].index : null;
  if (mode === "compare") state.row = compareRows().find(row => !row.shared)?.position ?? 0;
  render();
}
function navigateView(view) {
  if (state.view === "search" && view !== "search") state.searchQuery = "";
  state.view = view;
  state.returnView = view;
  state.investigation = null;
  state.findingsOnly = false;
  resetTree();
  renderDetails();
  renderRight();
  renderControls();
}
function openUtility(view) {
  if (!["warnings", "help", "snapshot"].includes(state.view)) state.returnView = state.view;
  state.view = view;
  renderDetails();
  renderRight();
  renderControls();
}
function selectLayer(index) {
  state.layer = index;
  state.limits.clear();
  state.selected = null;
  state.rightIndex = 0;
  render();
}
function selectRow(position) { state.row = position; renderHeader(); renderLayers(); renderDetails(); renderControls(); }
function moveRow(delta) {
  selectRow(Math.max(0, Math.min(compareRows().length - 1, state.row + delta)));
}
function moveLayer(delta) {
  const layers = image().layers;
  const at = layers.findIndex(l => l.index === state.layer);
  const next = layers[Math.max(0, Math.min(layers.length - 1, at + delta))];
  if (next) selectLayer(next.index);
}
function swapSides() {
  state.swapped = !state.swapped;
  resetTree();
  render();
}
function back() {
  if (state.view === "help" || state.view === "warnings" || state.view === "snapshot") {
    state.view = state.returnView; renderDetails(); renderRight(); renderControls(); return;
  }
  if (state.investigation && restoreInvestigation()) return;
  if (state.view === "search") {
    state.view = state.searchReturnView || "files"; state.searchQuery = ""; resetTree(); renderDetails(); renderRight(); renderControls(); return;
  }
  if (state.mode === "compare" && state.view === "files") navigateView("overview");
}
function toggleKind(kind) {
  if (state.mode === "compare") return;
  const set = state.hidden;
  if (set.has(kind)) set.delete(kind); else set.add(kind);
  renderRight();
  renderControls();
}
$("layers").addEventListener("click", () => $("layers").focus({ preventScroll: true }), true);
$("layers").addEventListener("keydown", event => {
  const map = { ArrowUp: -1, ArrowDown: 1, PageUp: -10, PageDown: 10, Home: -1e6, End: 1e6 };
  if (!(event.key in map)) return;
  event.preventDefault();
  if (state.mode === "compare") moveRow(map[event.key]); else moveLayer(map[event.key]);
  $("layers").focus();
});
const RIGHT_ROW_SELECTOR = ".trow, .package-diff-row, .comparison-section > summary, .comparison-unchanged, .package-group > summary, .package-scope > summary, .package-row > summary, .search-row, .overview-choice, .insight-group > summary";
function rightRows() {
  return [...$("right").querySelectorAll(RIGHT_ROW_SELECTOR)]
    .filter(row => {
      for (let parent = row.parentElement; parent && parent !== $("right"); parent = parent.parentElement) {
        if (parent instanceof HTMLDetailsElement && !parent.open &&
          !(row.tagName === "SUMMARY" && row.parentElement === parent)) return false;
      }
      return row.getClientRects().length > 0;
    });
}
function markRightSelection() {
  const rows = rightRows();
  if (state.selected) {
    const selected = rows.findIndex(row => row.dataset.path === state.selected);
    if (selected >= 0) state.rightIndex = selected;
  }
  state.rightIndex = Math.max(0, Math.min(state.rightIndex, rows.length - 1));
  rows.forEach((row, i) => {
    row.classList.toggle("right-selected", i === state.rightIndex);
    const mark = row.querySelector(".choice-mark, .selection-mark");
    if (mark) mark.textContent = i === state.rightIndex ? "\u258c" : "";
    if (row.getAttribute("role") === "treeitem") row.setAttribute("aria-selected", String(i === state.rightIndex));
  });
  if (state.mode === "image" && state.view === "files") {
    state.selected = rows[state.rightIndex]?.dataset.path || null;
    const img = image(), layer = layerAt(img, state.layer);
    $("right").querySelector(".info")?.replaceWith(selectionInfo(img,
      state.whole ? wholeSnapshot(img, state.layer).entries : layer ? layer.changes : [],
      treeMetadata(img, state.layer, state.whole)));
  }
}
$("right-pane").addEventListener("keydown", event => {
  const rows = rightRows();
  const focusedRow = event.target instanceof Element ? event.target.closest(RIGHT_ROW_SELECTOR) : null;
  if (event.target !== $("right-pane") && !focusedRow) return;
  if (!rows.length) return;
  const focusedIndex = focusedRow ? rows.indexOf(focusedRow) : -1;
  if (focusedIndex >= 0) state.rightIndex = focusedIndex;
  const map = { ArrowUp: -1, ArrowDown: 1, PageUp: -10, PageDown: 10, Home: -1e6, End: 1e6 };
  if (event.key in map) {
    event.preventDefault();
    state.rightIndex = Math.max(0, Math.min(rows.length - 1, state.rightIndex + map[event.key]));
    const row = rows[state.rightIndex];
    if (!row.dataset.path) state.selected = null;
    if (row.dataset.path) {
      state.selected = row.dataset.path;
      rows.forEach(item => { if (item.hasAttribute("aria-selected")) item.setAttribute("aria-selected", String(item === row)); });
    }
    if (state.view === "insights" && row.dataset.findingSelection !== undefined) {
      state.findingSelected = Number(row.dataset.findingSelection);
      renderDetails();
    }
    const info = $("right").querySelector(".info");
    if (info && state.view === "files" && state.mode === "compare")
      info.replaceWith(comparisonSelectionInfo(comparisonPathSizes()));
    markRightSelection();
    updateSearchSelection();
    $("right-pane").focus({ preventScroll: true });
    row.scrollIntoView({ block: "nearest" });
    return;
  }
  const row = rows[state.rightIndex];
  if (event.key === "Enter" || event.key === " " || event.key === "ArrowLeft" || event.key === "ArrowRight") {
    const expanded = row.getAttribute("aria-expanded");
    const details = row.parentElement instanceof HTMLDetailsElement ? row.parentElement : null;
    const open = expanded === null ? details?.open : expanded === "true";
    if (event.key === "Enter" || event.key === " " || open !== undefined && open !== null &&
        ((event.key === "ArrowLeft" && open) || (event.key === "ArrowRight" && !open))) {
      event.preventDefault();
      const toggle = row.querySelector(".tree-toggle");
      if (toggle) toggle.click();
      else if (event.key === "Enter" || event.key === " " || details) row.click();
      markRightSelection();
    } else if (event.key === "ArrowLeft" && (expanded === null || expanded === "false")) {
      const depth = Number(row.getAttribute("aria-level") || 0);
      for (let i = state.rightIndex - 1; i >= 0; i--) {
        const parent = rows[i];
        if (parent.getAttribute("aria-expanded") !== null &&
            Number(parent.getAttribute("aria-level") || 0) < depth) {
          state.rightIndex = i;
          state.selected = parent.dataset.path || null;
          markRightSelection();
          if (state.mode === "compare") {
            const info = $("right").querySelector(".info");
            info?.replaceWith(comparisonSelectionInfo(comparisonPathSizes()));
          }
          parent.scrollIntoView({ block: "nearest" });
          break;
        }
      }
    }
  }
});
$("right-pane").addEventListener("click", event => {
  const summary = event.target instanceof Element ? event.target.closest("summary") : null;
  if (!summary) return;
  state.selected = null;
  state.rightIndex = Math.max(0, rightRows().indexOf(summary));
  if (state.mode === "compare") {
    const info = $("right").querySelector(".info");
    info?.replaceWith(comparisonSelectionInfo(comparisonPathSizes()));
  }
  markRightSelection();
}, true);
$("right-pane").addEventListener("click", event => {
  if (event.target instanceof Element &&
      event.target.closest("button, input, summary, select, textarea, a")) return;
  $("right-pane").focus({ preventScroll: true });
});
document.addEventListener("keydown", event => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const typing = event.target instanceof HTMLInputElement;
  if (event.key === "Escape") {
    if (typing && event.target.value) {
      event.preventDefault();
      event.target.value = "";
      event.target.dispatchEvent(new Event("input", { bubbles: true }));
    } else {
      if (typing) event.target.blur();
      back();
    }
  }
});

(() => {
  const img = image();
  const initial = report.initialLayer;
  const start = initial !== null && initial !== undefined && layerAt(img, initial) ? initial
    : img.layers.length ? img.layers[0].index : null;
  state.layer = start;
  if (comparing) state.row = compareRows().find(row => !row.shared)?.position ?? 0;
  render();
  $("layers").focus({ preventScroll: true });
})();
})().catch(error => {
  const message = document.createElement("p");
  message.textContent = `The report could not be loaded: ${error.message}. Open it in a current version of Chrome, Edge, Firefox, or Safari.`;
  document.body.replaceChildren(message);
});
</script>
</body>
</html>
