name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-drafter
  cancel-in-progress: false
  queue: max

jobs:

  prepare:
    name: Validate prepared release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      context: ${{ steps.prepare.outputs.context }}
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      sha: ${{ steps.prepare.outputs.sha }}
      already-published: ${{ steps.prepare.outputs.already-published }}
    steps:
      - name: Prepare release
        id: prepare
        uses: mthalman/release-automation/actions/prepare-release@dbda9774dde7b70af4eb22be7257ee9cd17c2d6f # v1.0.2
        with:
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}

  verify:
    name: Verify release source
    needs: prepare
    if: needs.prepare.outputs.already-published != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      source-sha: ${{ needs.prepare.outputs.sha }}

  # Native AOT executables are uploaded directly to the prepared draft release
  # rather than stored as workflow artifacts.
  exe:
    name: Build ${{ matrix.rid }} executable
    runs-on: ${{ matrix.os }}
    needs: [prepare, verify]
    if: needs.prepare.outputs.already-published != 'true'
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-11-arm
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: linux-musl-x64
            os: ubuntu-24.04
            musl: true
          - rid: linux-musl-arm64
            os: ubuntu-24.04-arm
            musl: true

    env:
      RID: ${{ matrix.rid }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET SDK
        if: ${{ !matrix.musl }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6

      - name: Install Linux Native AOT prerequisites
        if: ${{ runner.os == 'Linux' && !matrix.musl }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Publish
        if: ${{ !matrix.musl }}
        run: dotnet publish src/Valleysoft.Dredge/Valleysoft.Dredge.csproj -c Release -r "$RID" -p:PublishAot=true -o publish

      # JavaScript actions cannot run in Alpine job containers on arm64 runners,
      # so the musl build runs the AOT SDK image through docker on the native
      # runner instead. The image includes the native toolchain and Git.
      - name: Publish in Alpine
        if: ${{ matrix.musl }}
        env:
          MUSL_AOT_SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0-alpine-aot@sha256:3d32f66190407b9bcff337dfa4bb591cb7c6378b7cc6b1e5f688d8badf917c71
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env RID \
            --env HOME=/tmp/dredge-home \
            --env DOTNET_CLI_HOME=/tmp/dredge-home \
            --env NUGET_PACKAGES=/tmp/dredge-home/.nuget/packages \
            --env DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            --env DOTNET_NOLOGO=1 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$MUSL_AOT_SDK_IMAGE" \
            sh -c 'mkdir -p "$HOME" && dotnet publish src/Valleysoft.Dredge/Valleysoft.Dredge.csproj -c Release -r "$RID" -p:PublishAot=true -o publish'

      - name: Check Native AOT output
        run: bash .github/scripts/check-native-aot-output.sh publish "$RID"

      - name: Prepare release assets
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [[ "$RID" == win-* ]]; then
            dredgeExt=".exe"
          else
            dredgeExt=""
          fi

          exeName="dredge-${RELEASE_VERSION}-${RID}${dredgeExt}"
          mkdir -p release-assets
          cp "publish/dredge${dredgeExt}" "release-assets/$exeName"

          cd release-assets
          if command -v sha256sum >/dev/null; then
            hash="$(sha256sum "$exeName" | cut -d ' ' -f 1)"
          else
            hash="$(shasum -a 256 "$exeName" | cut -d ' ' -f 1)"
          fi
          printf '%s  %s\n' "$hash" "$exeName" > "${exeName}.sha256sum"

          echo "EXE_NAME=$exeName" >> "$GITHUB_ENV"

      - name: Upload executable to the prepared draft
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" "$EXE_NAME" "${EXE_NAME}.sha256sum" --clobber

  verify-exes:
    name: Verify executables
    needs: [prepare, exe]
    if: needs.prepare.outputs.already-published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Verify draft release executables
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          assetDir="$RUNNER_TEMP/release-assets"
          mkdir -p "$assetDir"
          cd "$assetDir"
          gh release download "$RELEASE_TAG" --pattern 'dredge-*'

          expected=()
          for rid in win-x64 win-arm64 osx-x64 osx-arm64 linux-x64 linux-arm64 linux-musl-x64 linux-musl-arm64; do
            if [[ "$rid" == win-* ]]; then
              dredgeExt=".exe"
            else
              dredgeExt=""
            fi
            exeName="dredge-${RELEASE_VERSION}-${rid}${dredgeExt}"
            expected+=("$exeName" "${exeName}.sha256sum")
          done

          expectedList="$(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)"
          actualList="$(find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          if [ "$actualList" != "$expectedList" ]; then
            echo "::error::The draft release executables do not match the expected set."
            diff <(echo "$expectedList") <(echo "$actualList") || true
            exit 1
          fi

          sha256sum --check --strict ./*.sha256sum

  nuget:
    name: Publish NuGet Package
    runs-on: ubuntu-latest
    needs: [prepare, verify-exes]
    if: needs.prepare.outputs.already-published != 'true'
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore Valleysoft.Dredge

      - name: Pack
        run: dotnet pack -c Release Valleysoft.Dredge -p:IsPack=true
      
      - name: Publish Package
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_ORG_API_KEY }}
        run: dotnet nuget push "Valleysoft.Dredge/bin/Release/*.nupkg" -k "$NUGET_API_KEY" -s https://nuget.org

  docker:
    uses: ./.github/workflows/docker-publish.yml
    needs: [prepare, nuget]
    if: needs.prepare.outputs.already-published != 'true'
    permissions:
      contents: read
      packages: write
    with:
      source-sha: ${{ needs.prepare.outputs.sha }}

  finalize:
    name: Publish GitHub Release
    needs: [prepare, docker]
    if: needs.prepare.outputs.already-published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Finalize release
        uses: mthalman/release-automation/actions/finalize-release@dbda9774dde7b70af4eb22be7257ee9cd17c2d6f # v1.0.2
        with:
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          context: ${{ needs.prepare.outputs.context }}
